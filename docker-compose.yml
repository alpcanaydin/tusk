services:
  postgres:
    image: postgres:17
    container_name: veri-postgres
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: veri
      POSTGRES_PASSWORD: veri
      POSTGRES_DB: veri_dev
    volumes:
      - veri-pgdata:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veri -d veri_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  veri-pgdata:
