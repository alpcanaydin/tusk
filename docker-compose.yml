services:
  postgres:
    image: postgres:17
    container_name: tusk-postgres
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: tusk
      POSTGRES_PASSWORD: tusk
      POSTGRES_DB: tusk_dev
    volumes:
      - tusk-pgdata:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tusk -d tusk_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tusk-pgdata:
