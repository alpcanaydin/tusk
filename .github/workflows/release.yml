name: release

# A pushed tag `v<version>` (scripts/tag-release.sh) builds, signs, notarizes
# and publishes Tusk: the DMG and the Sparkle appcast go to a GitHub release,
# and the Homebrew cask gets the new version.
'on':
  push:
    tags: ['v*']

# One release at a time, never cancelled half-way through notarization.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # GitHub can deliver one tag push twice; the second run finds the release
  # already published and stops here instead of failing after a rebuild.
  check:
    name: Not yet published
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    name: Linux archive
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and package
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake golang-go pkg-config libasound2-dev libdbus-1-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev
          rustup show active-toolchain || rustup toolchain install
          scripts/install-linux.sh
          install -Dm644 LICENSE "$HOME/.local/share/doc/tusk/LICENSE"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p target/release/bundle
          tar -C "$HOME/.local" -czf "target/release/bundle/Tusk-${version}-linux-x86_64.tar.gz" \
            bin/tusk bin/postgres-language-server bin/sqls \
            share/applications/tusk.desktop share/icons/hicolor/1024x1024/apps/tusk.png \
            share/icons/hicolor/scalable/apps/tusk.svg \
            share/doc/tusk/LICENSE
          scripts/package-linux.sh deb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-build
          path: |
            target/release/bundle/Tusk-*-linux-x86_64.tar.gz
            target/release/bundle/Tusk-*-ubuntu-amd64.deb
          if-no-files-found: error
          compression-level: 0

  fedora:
    name: Fedora RPM
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:44@sha256:be9d65e2344d805cc11114319c685ecaa96b6d9b4350a0a6460cdb931babbd19
    timeout-minutes: 15
    steps:
      - run: dnf install -y git tar gzip rpm-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-build
          path: target/release/bundle
      - run: scripts/package-linux.sh rpm
      - run: dnf install -y target/release/bundle/Tusk-*-fedora-x86_64.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora-rpm
          path: target/release/bundle/Tusk-*-fedora-x86_64.rpm
          if-no-files-found: error

  build:
    name: Build and publish
    needs: [check, linux, fedora]
    if: needs.check.outputs.published != 'true'
    runs-on: macos-15
    timeout-minutes: 90
    # The signing secrets live in this environment only.
    environment: release
    permissions:
      contents: write # create the GitHub release
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches Cargo.toml
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No build cache here: a release builds from a clean tree.
      - name: Toolchain and bundled tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          brew install --quiet libpq go

      - name: Signing keychain
        run: .github/scripts/keychain.sh
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}

      - name: Release notes
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'

          ### Linux build (x86_64)

          Ubuntu 24.04: download and install the `.deb` with `sudo apt install ./Tusk-*-ubuntu-amd64.deb`.
          Fedora: download and install the `.rpm` with `sudo dnf install ./Tusk-*-fedora-x86_64.rpm`.
          For other distributions, download the Linux tarball and install it with:

          ```sh
          mkdir -p ~/.local
          tar -C ~/.local -xzf Tusk-*-linux-x86_64.tar.gz
          ~/.local/bin/tusk
          ```

          This build runs on Wayland with Xwayland fallback. It includes both SQL
          language servers. Install your distribution's PostgreSQL client tools
          for backup and restore, and use a Secret Service provider to save passwords.
          See the README for system dependencies and source build instructions.
          EOF
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build, sign, notarize
        run: scripts/release.sh "$RUNNER_TEMP/notes.md"
        env:
          TUSK_REPO: ${{ github.repository }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Checksum
        id: dmg
        run: |
          dmg="target/release/bundle/Tusk-$VERSION-arm64.dmg"
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Download Linux archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-build
          path: target/release/bundle

      - name: Download Fedora RPM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fedora-rpm
          path: target/release/bundle

      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/release/bundle/Tusk-$VERSION-arm64.dmg" \
            "target/release/bundle/Tusk-$VERSION-linux-x86_64.tar.gz" \
            "target/release/bundle/Tusk-$VERSION-ubuntu-amd64.deb" \
            "target/release/bundle/Tusk-$VERSION-fedora-x86_64.rpm" \
            target/release/bundle/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --title "Tusk $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Remove the signing keychain
        if: always()
        run: |
          [ -n "${RELEASE_KEYCHAIN:-}" ] && security delete-keychain "$RELEASE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/notary.p8

  homebrew:
    name: Homebrew cask
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tap is its own repo (alpcanaydin/homebrew-tusk); a fine-grained
      # token with contents: write on that repo alone pushes the new cask.
      - name: Update the cask
        run: .github/scripts/cask.sh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'alpcanaydin/homebrew-tusk' }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
