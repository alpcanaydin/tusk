name: release

# A pushed tag `v<version>` (scripts/tag-release.sh) builds, signs, notarizes
# and publishes Tusk: the DMG and the Sparkle appcast go to a GitHub release,
# and the Homebrew cask gets the new version.
'on':
  push:
    tags: ['v*']
  # Dry run from any branch: builds the Linux and Windows packages only
  # (the macOS job needs the tag-only "release" environment).
  workflow_dispatch:

# One release at a time, never cancelled half-way through notarization.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # GitHub can deliver one tag push twice; the second run finds the release
  # already published and stops here instead of failing after a rebuild.
  check:
    name: Not yet published
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    name: Linux packages
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and package
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake golang-go pkg-config libasound2-dev libdbus-1-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev
          rustup show active-toolchain || rustup toolchain install
          scripts/install-linux.sh
          install -Dm644 LICENSE "$HOME/.local/share/doc/tusk/LICENSE"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p target/release/bundle
          tar -C "$HOME/.local" -czf "target/release/bundle/Tusk-${version}-linux-x86_64.tar.gz" \
            bin/tusk bin/postgres-language-server bin/sqls \
            share/applications/tusk.desktop share/icons/hicolor/1024x1024/apps/tusk.png \
            share/icons/hicolor/scalable/apps/tusk.svg \
            share/doc/tusk/LICENSE
          scripts/package-linux.sh deb

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-build
          path: |
            target/release/bundle/Tusk-*-linux-x86_64.tar.gz
            target/release/bundle/Tusk-*-ubuntu-amd64.deb
          if-no-files-found: error
          compression-level: 0

  fedora:
    name: Fedora RPM
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:44@sha256:be9d65e2344d805cc11114319c685ecaa96b6d9b4350a0a6460cdb931babbd19
    timeout-minutes: 15
    steps:
      - run: dnf install -y git tar gzip rpm-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-build
          path: target/release/bundle
      - run: scripts/package-linux.sh rpm
      - run: dnf install -y target/release/bundle/Tusk-*-fedora-x86_64.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora-rpm
          path: target/release/bundle/Tusk-*-fedora-x86_64.rpm
          if-no-files-found: error

  arch:
    name: Arch package
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:8edb44f40a0cb5d3e44ef474f02780098ce0084e591c8641bdc01f02f185cc40
    timeout-minutes: 20
    steps:
      - run: pacman -Syu --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-build
          path: target/release/bundle
      - name: Build and install package
        run: |
          useradd -m builder
          chown -R builder:builder target/release/bundle
          runuser -u builder -- scripts/package-linux.sh arch
          pacman -U --noconfirm target/release/bundle/Tusk-*-arch-x86_64.pkg.tar.zst
          ldd /usr/bin/tusk > /tmp/tusk-ldd.txt
          ! grep 'not found' /tmp/tusk-ldd.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-pkg
          path: target/release/bundle/Tusk-*-arch-x86_64.pkg.tar.zst
          if-no-files-found: error

  build:
    name: Build and publish
    needs: check
    if: needs.check.outputs.published != 'true' && github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 90
    # The signing secrets live in this environment only.
    environment: release
    permissions:
      contents: write # create the GitHub release
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches Cargo.toml
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No build cache here: a release builds from a clean tree.
      - name: Toolchain and bundled tools
        run: |
          rustup show active-toolchain || rustup toolchain install
          brew install --quiet libpq go

      - name: Signing keychain
        run: .github/scripts/keychain.sh
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}

      # Hand-written notes (docs/release-notes/<version>.md) when present,
      # otherwise GitHub's generated changelog.
      - name: Release notes
        run: |
          notes="docs/release-notes/$VERSION.md"
          if [ -f "$notes" ]; then
            cp "$notes" "$RUNNER_TEMP/notes.md"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body > "$RUNNER_TEMP/notes.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build, sign, notarize
        run: scripts/release.sh "$RUNNER_TEMP/notes.md"
        env:
          TUSK_REPO: ${{ github.repository }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Checksum
        id: dmg
        run: |
          dmg="target/release/bundle/Tusk-$VERSION-arm64.dmg"
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "target/release/bundle/Tusk-$VERSION-arm64.dmg" \
            target/release/bundle/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --title "Tusk $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Remove the signing keychain
        if: always()
        run: |
          [ -n "${RELEASE_KEYCHAIN:-}" ] && security delete-keychain "$RELEASE_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP"/notary.p8

  windows:
    name: Windows (${{ matrix.arch }})
    needs: check
    if: needs.check.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ring needs clang; the arm64 image doesn't ship LLVM.
      - name: Toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) { choco install llvm -y --no-progress }
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { rustup toolchain install }

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $stage = "Tusk-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\tusk.exe "$stage\Tusk.exe"
          Copy-Item LICENSE "$stage\LICENSE.txt"
          New-Item -ItemType Directory -Force -Path target\release\bundle | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "target\release\bundle\$stage.zip" -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: target/release/bundle/Tusk-*-windows-*.zip
          if-no-files-found: error
          compression-level: 0

  # Linux and Windows packages join the release once it exists; a failing
  # platform never holds back the macOS release (the appcast updates users).
  attach:
    name: Attach Linux and Windows packages
    needs: [build, linux, fedora, arch, windows]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          merge-multiple: true
      - name: Upload
        run: |
          shopt -s nullglob
          files=(packages/*.deb packages/*.rpm packages/*.pkg.tar.zst packages/*-windows-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::no Linux or Windows packages to attach"
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    name: Homebrew cask
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tap is its own repo (alpcanaydin/homebrew-tusk); a fine-grained
      # token with contents: write on that repo alone pushes the new cask.
      - name: Update the cask
        run: .github/scripts/cask.sh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'alpcanaydin/homebrew-tusk' }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
