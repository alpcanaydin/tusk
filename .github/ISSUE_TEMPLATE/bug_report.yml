name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Open …
        3. …
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      options: [PostgreSQL, MySQL, MariaDB, SQLite, SQL Server, Oracle, ClickHouse, DuckDB, Snowflake, BigQuery, Redis, MongoDB, Cassandra, DynamoDB, CockroachDB, Redshift, Other / not specific]
    validations:
      required: true
  - type: input
    id: tusk
    attributes:
      label: Tusk version
      description: "Tusk ▸ About Tusk on macOS, or \"app: about tusk\" in the command palette"
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      description: For Linux, the distribution and desktop too.
      placeholder: "macOS 15.6 · Windows 11 24H2 · Ubuntu 24.04 (GNOME, Wayland)"
    validations:
      required: true
